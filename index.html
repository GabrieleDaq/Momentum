<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Momentum</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <div class="app">

        <!-- HEADER -->

        <header class="topbar">

            <div>
                <p class="brand">MOMENTUM</p>

                <h1>Oggi</h1>

                <p
                    id="current-date"
                    class="current-date"
                ></p>
            </div>


            <div class="score-card">

                <span id="daily-score">
                    0%
                </span>

                <small>
                    completato
                </small>

            </div>

        </header>


        <!-- DAILY PROGRESS -->

        <section class="overview-card">

            <div class="overview-top">

                <div>
                    <p class="mini-label">
                        DAILY SCORE
                    </p>

                    <strong id="daily-counter">
                        0 / 7
                    </strong>
                </div>

                <span id="daily-message">
                    Iniziamo.
                </span>

            </div>


            <div class="progress-track">

                <div
                    id="daily-progress"
                    class="progress-fill"
                ></div>

            </div>

        </section>


        <!-- DAILY -->

        <section class="habit-section">

            <div class="section-heading">

                <div>
                    <p class="section-label">
                        🌞 DAILY
                    </p>

                    <h2>
                        Ogni giorno
                    </h2>
                </div>

                <span class="section-frequency">
                    Oggi
                </span>

            </div>


            <div
                id="daily-list"
                class="habit-list"
            ></div>

        </section>


        <!-- WEEKLY -->

        <section class="habit-section">

            <div class="section-heading">

                <div>
                    <p class="section-label">
                        📅 WEEKLY
                    </p>

                    <h2>
                        Questa settimana
                    </h2>
                </div>

                <span
                    id="weekly-score"
                    class="section-frequency"
                >
                    0 / 2
                </span>

            </div>


            <div
                id="weekly-list"
                class="habit-list"
            ></div>

        </section>


        <!-- MONTHLY -->

        <section class="habit-section">

            <div class="section-heading">

                <div>
                    <p class="section-label">
                        🗓️ MONTHLY
                    </p>

                    <h2>
                        Questo mese
                    </h2>
                </div>

                <span
                    id="monthly-score"
                    class="section-frequency"
                >
                    0 / 2
                </span>

            </div>


            <div
                id="monthly-list"
                class="habit-list"
            ></div>

        </section>


        <footer>

            <p>
                Momentum • costruisci costanza, non perfezione.
            </p>

        </footer>

    </div>


    <script src="app.js"></script>

</body>

</html>
